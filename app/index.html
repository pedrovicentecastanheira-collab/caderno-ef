<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderno EF</title>
<meta name="description" content="Caderno de Educação Física: aulas, sumários, presenças, avaliação PNEF, FITescola e pauta.">
<meta name="theme-color" content="#1C55CF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno EF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: app shell — sticky header with turma + período, one scrolling column (max 720px), fixed bottom tab bar, bottom sheets for editing */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#13202D; --muted:#5A6879; --line:#D8DFE7;
  --accent:#1C55CF; --accent-ink:#FFFFFF; --accent-soft:#E1E9FA;
  --ok:#1C7C46; --ok-soft:#DCF0E3; --bad:#BF352D; --bad-soft:#F8E0DD;
  --warn:#9C620E; --warn-soft:#F6EAD2; --mat:#7142B8; --mat-soft:#ECE3F8; --dis:#647283; --dis-soft:#E5E9EE;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100; --v5:#e87ba4; --v6:#008300; --v7:#6250d6; --v8:#e34948; --q1:#86b6ef; --q2:#3987e5; --q3:#1c5cab; --q4:#0d366b; --st-good:#0ca30c; --st-crit:#d03b3b; --st-warn:#fab219; --v-none:#C9D0D8;
  --shadow:0 1px 2px rgba(19,32,45,.06),0 6px 18px rgba(19,32,45,.07);
  --scrim:rgba(14,22,32,.45);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --hm1:#fff; --hm3:#0D131A; --hm4:#0D131A;
  --bg:#0D131A; --surface:#161F29; --surface-2:#1B2531; --ink:#E5EBF2; --muted:#93A1B2; --line:#27323F;
  --accent:#6E97F2; --accent-ink:#0A1222; --accent-soft:#1C2B47;
  --ok:#55C487; --ok-soft:#173326; --bad:#F2776C; --bad-soft:#3A1E1D; --warn:#E3B356; --warn-soft:#352915;
  --mat:#B592F2; --mat-soft:#2B2140; --dis:#95A2B1; --dis-soft:#232D38;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; --v7:#9085e9; --v8:#e66767; --q1:#184f95; --q2:#2a78d6; --q3:#6da7ec; --q4:#b7d3f6; --st-good:#0ca30c; --st-crit:#d03b3b; --st-warn:#fab219; --v-none:#3A4553;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --hm1:#fff; --hm3:#0D131A; --hm4:#0D131A;
  --bg:#0D131A; --surface:#161F29; --surface-2:#1B2531; --ink:#E5EBF2; --muted:#93A1B2; --line:#27323F;
  --accent:#6E97F2; --accent-ink:#0A1222; --accent-soft:#1C2B47;
  --ok:#55C487; --ok-soft:#173326; --bad:#F2776C; --bad-soft:#3A1E1D; --warn:#E3B356; --warn-soft:#352915;
  --mat:#B592F2; --mat-soft:#2B2140; --dis:#95A2B1; --dis-soft:#232D38;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; --v7:#9085e9; --v8:#e66767; --q1:#184f95; --q2:#2a78d6; --q3:#6da7ec; --q4:#b7d3f6; --st-good:#0ca30c; --st-crit:#d03b3b; --st-warn:#fab219; --v-none:#3A4553;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.num-t{font-variant-numeric:tabular-nums}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.brand b{color:var(--accent)}
.turma-sel{flex:1;min-width:0;position:relative}
.turma-sel select{width:100%;appearance:none;-webkit-appearance:none;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:22px;padding:2px 22px 2px 0;text-overflow:ellipsis}
.turma-sel::after{content:"";position:absolute;right:4px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.block{display:flex;width:100%}
.seg.block button{flex:1}

/* main */
#main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.sec-h h2{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:24px;line-height:1;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button.card{display:block;width:100%;text-align:left}
.aula-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.licao{font-family:var(--f-display);font-weight:700;font-size:18px}
.licao span{color:var(--accent)}
.date{color:var(--muted);font-size:13.5px;white-space:nowrap}
.sum{margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
button.chip{border-color:var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;font-size:13.5px}
button.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed}
.pres-mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.tag.F{background:var(--bad-soft);color:var(--bad)} .tag.A{background:var(--warn-soft);color:var(--warn)}
.tag.M{background:var(--mat-soft);color:var(--mat)} .tag.D{background:var(--dis-soft);color:var(--dis)} .tag.P{background:var(--ok-soft);color:var(--ok)}
.tag.reg{background:var(--warn-soft);color:var(--warn)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:52px}
.li:first-child{border-top:0}
.li .n{width:26px;flex:none;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.li .who{flex:1;min-width:0}
.li .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:12.5px;color:var(--muted)}
.li .end{flex:none;display:flex;gap:6px;align-items:center}

/* rows for evaluation */
.ev{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ev:first-child{border-top:0}
.ev-h{display:flex;align-items:center;gap:10px;min-width:0}
.ev-h .n{width:24px;flex:none;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ev-h .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-h .val{flex:none;font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.ev.off{opacity:.55}
.lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.lv{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:40px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);padding:0}
.lv.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv.on.NI{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.hint{font-size:12.5px;color:var(--muted)}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.crit{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.crit .cl{font-size:13px;font-weight:600;color:var(--muted)}
.cdesc{font-size:12.5px;color:var(--muted);margin:-2px 0 0 104px}
.crit select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px 8px;font-size:13.5px}
.fit-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fit-in input{width:96px}
.zone{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.zone.z0{background:var(--bad-soft);color:var(--bad)} .zone.z1{background:var(--ok-soft);color:var(--ok)} .zone.z2{background:var(--accent-soft);color:var(--accent)}
.zman{display:inline-grid;grid-template-columns:repeat(3,auto);gap:4px}
.zman button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.zman button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* presence */
.pr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .n{width:22px;flex:none;font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pr .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{display:grid;grid-template-columns:repeat(5,38px);gap:3px;flex:none}
.ps button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);padding:0}
.ps button.on.P{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ps button.on.F{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.ps button.on.A{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.ps button.on.M{background:var(--mat);border-color:var(--mat);color:var(--surface)}
.ps button.on.D{background:var(--dis);border-color:var(--dis);color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend b{font-family:var(--f-display);font-size:14px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.l,th.l{text-align:left}
td.nm{max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
tr.click{cursor:pointer}
td.low{color:var(--bad);font-weight:600}
td.fin{font-family:var(--f-display);font-weight:700;font-size:18px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.inc{background:var(--surface-2);color:var(--muted)}
table.ref input{width:64px;min-height:36px;padding:6px;font-size:15px;text-align:center}

.hist{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.hi{display:flex;flex-direction:column;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:5px}
/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.bad b{color:var(--bad)}

details.desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.desc summary{padding:12px 0;font-weight:600;cursor:pointer}
details.desc dl{margin:0 0 12px;display:grid;gap:8px}
details.desc dt{font-family:var(--f-display);font-weight:700;color:var(--accent)}
details.desc dd{margin:0;font-size:13.5px}

.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.welcome{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.welcome h1{font-size:34px}
.welcome ul{margin:0;padding-left:18px;display:grid;gap:4px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}

/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.sh-back{position:absolute;inset:0;background:var(--scrim)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:94%;margin:0 auto;max-width:720px;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-h h2{font-size:22px}
.sh-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));flex:1;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sh-f .btn{flex:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:var(--surface)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
/* photos */
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;overflow:hidden}
.av.sm{width:28px;height:28px;font-size:12px}
.av.lg{width:96px;height:96px;font-size:34px}
.foto-ed{display:flex;align-items:center;gap:14px}
.foto-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.foto-row:first-child{border-top:0}
.foto-row img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.foto-row .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.foto-row .fn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* class grid: one table, tap a cell, values in the editor bar */
.vt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gbr{display:flex;gap:4px}
.gbr .lv{flex:1;min-width:0}
.g0{--gc:var(--bad);--gs:var(--bad-soft)} .g1{--gc:var(--warn);--gs:var(--warn-soft)} .g2{--gc:var(--accent);--gs:var(--accent-soft)} .g3{--gc:var(--ok);--gs:var(--ok-soft)}
.gbr .lv.on,.gbr .lv.on.NI{background:var(--gc,var(--ink));border-color:var(--gc,var(--ink));color:var(--surface)}
.gwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:70vh;overscroll-behavior:contain}
table.gt2{border-collapse:separate;border-spacing:0;font-size:14px;width:max-content;min-width:100%}
.gt2 th,.gt2 td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}

<script>
"use strict";
const PNEF = {"1":[{"m":"Perícias e Manipulações","I":"Executa ações motoras básicas com aparelhos portáteis (ex.: bolas, arcos, cordas) em situação simples e individual.","E":"Em concurso individual e a pares, realiza ações motoras básicas com aparelhos portáteis segundo uma estrutura rítmica ou combinação de movimentos.","A":"Combina e encadeia ações com aparelhos portáteis em concurso individual, a pares e em estafetas, ajustando a ação ao efeito pretendido de movimentação do aparelho."},{"m":"Deslocamentos e Equilíbrios","I":"Desloca-se e equilibra-se em situações simples, no solo, com controlo postural básico.","E":"Realiza ações motoras básicas de deslocamento e equilíbrio no solo e em aparelhos, segundo uma estrutura rítmica ou combinação de movimentos.","A":"Realiza percursos que integram várias habilidades de deslocamento e equilíbrio, incluindo situações de voo, aceleração e apoio instável ou limitado, com coordenação e aproveitamento das qualidades motoras da situação."},{"m":"Ginástica","I":"Executa elementos gímnicos de solo básicos (ex.: cambalhota à frente) com ajuda e em segurança.","E":"Executa um pequeno conjunto de elementos gímnicos de solo e/ou aparelhos, ligados numa sequência simples.","A":"Executa uma sequência gímnica (solo e/ou aparelhos) que combina vários elementos com continuidade e controlo postural adequado."},{"m":"Jogos","I":"Participa em jogos simples de perseguição e de cooperação, aplicando as regras combinadas na turma.","E":"Participa em jogos coletivos com bola, jogos de perseguição, jogos de oposição e jogos de raquete, realizando habilidades básicas com alguma oportunidade e correção.","A":"Participa nos jogos coletivos com bola, de perseguição, de oposição e de raquete, ajustando a iniciativa própria e as qualidades motoras às possibilidades da situação de jogo, realizando ações técnico-táticas fundamentais com oportunidade e correção de movimentos."},{"m":"Atividades Rítmicas Expressivas","I":"Reproduz, com o corpo, um ritmo ou movimento simples sugerido pelo professor ou pela música.","E":"Combina um pequeno conjunto de movimentos numa sequência rítmica simples, ajustada à música.","A":"Executa uma sequência rítmica e expressiva completa, com coordenação entre o movimento, o espaço e a música."}],"2":[{"m":"Voleibol","I":"Em grupos de 4 (rede a ~2m), mantém a bola no ar com passe de dedos e manchete; serve por baixo a 3-4,5m da rede; em jogo 2x2 de campo reduzido, dá continuidade à bola com toques de dedos e por baixo dos antebraços.","E":"Em jogo 2x2, executa serviço por baixo, passe e manchete direcionados a um colega, iniciando organização ofensiva simples.","A":"Em jogo 3x3, combina receção-passe-remate simples, ocupando racionalmente o espaço de campo."},{"m":"Basquetebol","I":"Em jogo 3x3 (campo reduzido) ou 5x5, recebe a bola enquadrado ofensivamente, lança na passada ou parado de curta distância, dribla para progredir ou ultrapassar o adversário direto, passa a companheiro desmarcado, desmarca-se criando linhas de passe, defende o adversário direto e participa no ressalto.","E":"Em jogo 3x3, executa passe e corte, defende o adversário direto e lança em apoio após receção.","A":"Em jogo 3x3/5x5, combina drible-passe-lançamento com leitura simples da defesa."},{"m":"Andebol","I":"Em jogo de Andebol de 5 (campo reduzido, baliza baixa), desmarca-se oferecendo linha de passe, opta por passe armado ou drible em progressão, finaliza em remate em salto junto à área e defende procurando intercetar ou dificultar o remate do adversário; como guarda-redes, enquadra-se com a bola e inicia o contra-ataque.","E":"Em jogo 5x5, combina drible-passe-remate simples e participa no contra-ataque em superioridade numérica.","A":"Em jogo 5x5/7x7, cria linhas de passe e finaliza com oposição ligeira."},{"m":"Futebol","I":"Em jogo de Futebol 4x4 (espaço amplo, com guarda-redes), recebe e controla a bola, remata se tem a baliza ao alcance, passa a companheiro desmarcado ou conduz a bola para rematar, desmarca-se criando linhas de passe e marca o adversário direto na defesa.","E":"Em jogo 5x5, desmarca-se para receber, finta o adversário direto e finaliza em situação favorável.","A":"Em jogo 5x5/7x7, combina passe-condução-remate com noção de ocupação racional do espaço."},{"m":"Ginástica de Solo","I":"Combina numa sequência: cambalhota à frente terminando a pés juntos, cambalhota à frente em plano inclinado com pernas afastadas, cambalhota à retaguarda com saída de pernas afastadas ou pés juntos, passagem por pino seguida de cambalhota à frente, subida para pino e roda com apoio alternado das mãos.","E":"Executa cambalhota à frente e à retaguarda com maior controlo postural e liga dois elementos numa pequena sequência.","A":"Executa ponte e apoio facial invertido (pino) com ajuda, integrando-os numa sequência simples."},{"m":"Ginástica de Aparelhos (Trampolins)","I":"Após corrida de balanço e chamada a pés juntos, executa salto de eixo e salto entre-mãos no boque/plinto e cambalhota à frente no plinto longitudinal; no mini-trampolim, executa o salto em extensão (vela) após corrida de balanço ou após saltos de impulsão.","E":"Executa salto engrupado no minitrampolim com voo controlado e receção estável.","A":"Executa salto engrupado e salto carpado com continuidade, no minitrampolim ou trampolim, com ajuda."},{"m":"Atletismo","I":"Corrida de velocidade (40m) com partida de pé; salto em altura com técnica de tesoura, com quatro a seis passadas de balanço.","E":"Corre em velocidade com maior eficácia de apoios; salta em altura com técnica de tesoura, com receção equilibrada.","A":"Aplica as técnicas de velocidade e salto em altura em situação de prova simulada, com resultado dentro do esperado para o escalão."},{"m":"Natação","I":"Em piscina com pé, coordena inspiração e expiração pela boca e pelo nariz; flutua em equilíbrio nas posições ventral e dorsal, combinando mudanças de posição; associa o mergulho à flutuação para se deslocar com intencionalidade; desloca-se coordenando pernas, braços e respiração; salta para a piscina a partir de posições variadas.","E":"Nada crawl em distância curta com coordenação braços-pernas-respiração; desliza e nada em costas com propulsão de pernas.","A":"Nada crawl e costas com técnica melhorada em distância definida."},{"m":"Softbol","I":"Em jogo simplificado, agarra a bola parada com a luva, lança por baixo/ombro a curta distância e bate a bola do tee; corre para a 1.ª base.","E":"Recebe bolas rasteiras simples, lança para um colega próximo e bate a bola lançada devagar por um colega.","A":"Participa em jogo simplificado com rotação de posições e regras básicas de eliminação."},{"m":"Dança","I":"Desloca-se por toda a área combinando andar, correr, saltitar, deslizar, saltar, rolar, etc., ajustado à marcação rítmica; realiza equilíbrios e acentua estímulos musicais com movimentos; em grupo, segue formações (rodas, linhas, ziguezague); cria pequenas sequências de movimento, a pares ou em grupo, e apresenta-as com ambiente musical.","E":"Reproduz uma sequência curta de passos com ritmo e ocupação do espaço adequadas.","A":"Executa a coreografia completa em grupo, com sincronização ao ritmo."},{"m":"Badminton","I":"Em jogo de singulares simplificado, executa o serviço curto por baixo e devolve o volante em situação estática/cooperativa.","E":"Mantém a troca de volante com clear, deslocando-se para a posição base entre batimentos.","A":"Em jogo simplificado, varia entre clear e amortie com sucesso pontual."},{"m":"Judo/Luta","I":"Em luta no solo, aproveita situações de vantagem para tentar o assentamento de espáduas, aplicando dupla prisão de pernas com rotação, prisão de braço por dentro ou dupla prisão de braços; em guarda a quatro, desloca-se em quadrupedia procurando o enquadramento frontal ou a posição de pé; em luta em pé, aplica controlos (cabeça e braço, braço por dentro, dupla prisão de pernas) e projeções (barreira exterior, projeção anterior, braço rolado).","E":"Executa pegas fundamentais e um desequilíbrio simples, com o companheiro parado.","A":"Executa um exercício de projeção simples em situação estática/de baixa oposição."},{"m":"Patinagem","I":"Em patins, arranca para a frente/esquerda/direita, desliza sobre um apoio (figura \"Quatro\"), desliza para trás após impulso, desliza de cócoras, desenha \"oitos\", curva com pés paralelos, trava em T e faz meia volta em deslocamento.","E":"Desloca-se em curva ampla com controlo de velocidade.","A":"Desloca-se com impulsão alternada simples em percurso definido."}],"3":[{"m":"Voleibol","I":"Em grupos de 4, mantém a bola no ar com passe de dedos e manchete; serve por baixo a 3-4,5m da rede (~2m); recebe posicionando-se para dar trajetória alta à bola; em concurso 2x2 (campo reduzido), dá continuidade à bola com toques limitados por equipa.","E":"Em jogo 4x4 (campo 12x6m, rede a ~2,10-2,15m), serve por baixo ou por cima em zona de difícil receção, recebe em manchete ou por cima direcionando para o passador, posiciona-se para o segundo toque ou finaliza em remate de apoio, e executa passe alto/manchete na defesa; remata ao passe do companheiro com chamada e salto.","A":"Em jogo 4x4/6x6, remata em salto, inicia bloco simples e assegura cobertura de ataque, participando na rotação."},{"m":"Basquetebol","I":"Em jogo 3x3 (campo reduzido) ou 5x5, recebe a bola enquadrado ofensivamente, lança na passada ou parado de curta distância, dribla para progredir ou ultrapassar o adversário direto, passa a companheiro desmarcado, desmarca-se criando linhas de passe, defende o adversário direto e participa no ressalto.","E":"Em jogo 5x5, no contra-ataque desmarca-se oferecendo linha de passe e progride em drible pelo corredor central; ao receber a bola, enquadra-se e opta por lançamento, drible para finalizar ou passe a companheiro desmarcado; sem bola, desmarca-se para o cesto e participa no ressalto ofensivo; na defesa individual, dificulta drible, passe e lançamento e participa no ressalto defensivo.","A":"Em jogo 5x5, cria linhas de passe, participa no contra-ataque e defende em sistema misto simples."},{"m":"Andebol","I":"Em jogo de Andebol de 5 (campo reduzido, baliza baixa), desmarca-se oferecendo linha de passe, opta por passe armado ou drible em progressão, finaliza em remate em salto junto à área e defende procurando intercetar ou dificultar o remate do adversário; como guarda-redes, enquadra-se com a bola e inicia o contra-ataque.","E":"Em jogo 5x5 ou 7x7, no contra-ataque desmarca-se rapidamente oferecendo linhas de passe ofensivas e finaliza em remate em salto explorando vantagem numérica; sem vantagem imediata, mantém a posse com desmarcações e ultrapassagens 1x1; na defesa individual, faz marcação de proximidade e de vigilância; como guarda-redes, inicia o contra-ataque direto ou apoiado.","A":"Em jogo 7x7, combina cruzamentos simples e assegura cobertura defensiva organizada."},{"m":"Futebol","I":"Em jogo de Futebol 4x4 (espaço amplo, com guarda-redes), recebe e controla a bola, remata se tem a baliza ao alcance, passa a companheiro desmarcado ou conduz a bola para rematar, desmarca-se criando linhas de passe e marca o adversário direto na defesa.","E":"Em jogo 5x5 ou 7x7, recebe e enquadra-se ofensivamente, finta para se libertar da marcação e opta por rematar, passar a companheiro desmarcado ou conduzir a bola em progressão; desmarca-se com fintas e mudanças de direção garantindo largura e profundidade ao ataque; na defesa, marca o atacante; como guarda-redes, enquadra-se com a bola e inicia o ataque após recuperar a posse.","A":"Em jogo 7x7, participa em combinações ofensivas simples (triangulações) e assegura cobertura defensiva."},{"m":"Ginástica de Solo","I":"Combina numa sequência: cambalhota à frente terminando a pés juntos, cambalhota à frente em plano inclinado com pernas afastadas, cambalhota à retaguarda com saída de pernas afastadas ou pés juntos, passagem por pino seguida de cambalhota à frente, subida para pino e roda com apoio alternado das mãos.","E":"Elabora e executa uma sequência de solo com fluidez, combinando cambalhota à frente terminando em equilíbrio, cambalhota à frente saltada após corrida e chamada a pés juntos, cambalhota à retaguarda terminando em equilíbrio, pino de braços seguido de cambalhota à frente, roda com saída em equilíbrio, avião, posições de flexibilidade (ponte, espargata) e elementos de ligação (saltos, voltas, afundos); em exercício, executa também rodada e cambalhota à retaguarda com passagem por pino.","A":"Executa rondada e cambalhota à retaguarda com passagem por pino, encadeadas numa sequência com continuidade de movimento."},{"m":"Ginástica de Aparelhos (Trampolins)","I":"Após corrida de balanço e chamada a pés juntos, executa salto de eixo e salto entre-mãos no boque/plinto e cambalhota à frente no plinto longitudinal; no mini-trampolim, executa o salto em extensão (vela) após corrida de balanço ou após saltos de impulsão.","E":"No mini-trampolim, após corrida de balanço ou saltos de impulsão, executa salto em extensão, salto engrupado, pirueta vertical e carpa de pernas afastadas; progride para ¾ de mortal à frente engrupado e ¼ de mortal à retaguarda, com receção em colchão elevado; no plinto, executa salto de eixo e salto entre-mãos com maior amplitude de voo.","A":"Executa salto de mãos no minitrampolim e combina saltos no trampolim com maior amplitude de voo."},{"m":"Atletismo","I":"Corrida de velocidade (40m) com partida de pé; salto em altura com técnica de tesoura, com quatro a seis passadas de balanço.","E":"Corrida de velocidade (40-60m) com partida de tacos, acelerando até à velocidade máxima com apoios ativos; salto em altura com técnica de Fosbury Flop, com cinco a oito passadas de balanço.","A":"Executa as provas de velocidade e salto em altura em situação de prova simulada, com técnica ajustada e resultado que traduz progressão face ao nível Elementar."},{"m":"Natação","I":"Em piscina com pé, coordena inspiração e expiração pela boca e pelo nariz; flutua em equilíbrio nas posições ventral e dorsal, combinando mudanças de posição; associa o mergulho à flutuação para se deslocar com intencionalidade; desloca-se coordenando pernas, braços e respiração; salta para a piscina a partir de posições variadas.","E":"Coordena e combina a inspiração/expiração em situações propulsivas complexas de braços e pernas; realiza a respiração dos estilos crawl e costas associada aos movimentos propulsivos; desloca-se em posição dorsal e ventral, diferenciando entrada das mãos, trajeto propulsivo e recuperação, com ritmo e velocidade adequados; salta de cabeça a partir da posição de pé, com extensão do corpo; salta a partir de pé para zona funda, executando rotações em trajetória aérea.","A":"Nada os três estilos (crawl, costas e bruços) com técnica formal e viragem simples em distâncias mais exigentes."},{"m":"Softbol","I":"Em jogo simplificado, agarra a bola com a luva em situação estática, lança a bola por cima do ombro para um companheiro, e bate a bola colocada no suporte (tee) com a posição correta de batimento; corre para a 1.ª base após o batimento.","E":"Em jogo reduzido, recebe a bola rasteira e de ar em deslocamento, lança para a base correta para eliminar o corredor, bate a bola lançada pelo lançador (pitcher) e progride nas bases; conhece as regras de eliminação e a rotação de posições.","A":"Em jogo reduzido, desempenha mais do que uma posição defensiva e decide a base de destino do lançamento em função da situação de jogo."},{"m":"Dança","I":"Desloca-se por toda a área combinando andar, correr, saltitar, deslizar, saltar, rolar, etc., ajustado à marcação rítmica; realiza equilíbrios e acentua estímulos musicais com movimentos; em grupo, segue formações (rodas, linhas, ziguezague); cria pequenas sequências de movimento, a pares ou em grupo, e apresenta-as com ambiente musical.","E":"Aperfeiçoa sequências de saltos e voltas no lugar (variando apoios e amplitude) e sequências de passos combinados com voltas e poses; em grupo, segue formações mais complexas (linhas retas, quebradas, curvas); a pares/trios, conduz e segue o companheiro com qualidades de movimento idênticas ou contrárias; cria e apresenta composições e projetos coreográficos, individuais, a pares ou em grupo.","A":"Executa a coreografia com maior qualidade de movimento e expressividade, ajustando-se a variações de ritmo."},{"m":"Badminton","I":"Em cooperação a cerca de 6m, mantém posição base e desloca-se para devolver o volante sem o deixar cair, distinguindo pegas de direita/esquerda; executa clear (trajetórias altas) e lob (trajetórias baixas, em afundo); em exercício, executa o serviço curto e comprido.","E":"Em jogo de singulares, desloca-se e devolve o volante com serviço curto/comprido na diagonal, clear, lob, amorti (à direita e à esquerda, junto à rede) e drive (batimento à frente do corpo com trajetória tensa); em exercício, remata na sequência do serviço alto do companheiro, com trajetória descendente.","A":"Em jogo de singulares, alterna batimentos ofensivos e defensivos com intenção tática simples."},{"m":"Judo/Luta","I":"Em luta no solo, aproveita situações de vantagem para tentar o assentamento de espáduas, aplicando dupla prisão de pernas com rotação, prisão de braço por dentro ou dupla prisão de braços; em guarda a quatro, desloca-se em quadrupedia procurando o enquadramento frontal ou a posição de pé; em luta em pé, aplica controlos (cabeça e braço, braço por dentro, dupla prisão de pernas) e projeções (barreira exterior, projeção anterior, braço rolado).","E":"Em luta no solo, cria e aproveita vantagem nítida para o assentamento de espáduas com dupla prisão de pernas, prisão de braço por dentro, dupla prisão de braços ou pernas cruzadas, aplicando finalizações de controlo; em guarda a quatro, executa a passagem para cima a partir do controlo pela cintura; em pé, aplica controlos e projeções (barreira exterior, braço rolado, projeção anterior) e desequilíbrio à retaguarda a partir do controlo da perna por dentro.","A":"Combina uma projeção e uma imobilização em sequência, com o companheiro em oposição ligeira."},{"m":"Patinagem","I":"Em patins, arranca para a frente/esquerda/direita, desliza sobre um apoio (figura \"Quatro\"), desliza para trás após impulso, desliza de cócoras, desenha \"oitos\", curva com pés paralelos, trava em T e faz meia volta em deslocamento.","E":"Realiza um percurso e uma composição em pares/trios com música: patina para a frente em apoio alternado, desliza para a frente e para trás sobre um patim, desliza para trás cruzando as pernas, executa curvas com cruzamento de pernas, trava em T e em deslize para trás, desliza em posição de \"águia\" e inverte o sentido, faz meia volta/volta em deslocamento e saltos a um ou dois pés sobre obstáculos.","A":"Combina deslocamento, curvas e travagem num percurso com obstáculos simples."}],"S":[{"m":"Voleibol","I":"Em grupos de 4, mantém a bola no ar com passe de dedos e manchete; serve por baixo a 3-4,5m da rede (~2m); recebe posicionando-se para dar trajetória alta à bola; em concurso 2x2 (campo reduzido), dá continuidade à bola com toques limitados por equipa.","E":"Em jogo 4x4 (campo 12x6m, rede a ~2,10-2,15m), serve por baixo ou por cima em zona de difícil receção, recebe em manchete ou por cima direcionando para o passador, posiciona-se para o segundo toque ou finaliza em remate de apoio, e executa passe alto/manchete na defesa; remata ao passe do companheiro com chamada e salto.","A":"Em jogo formal 6x6, aplica sistemas de jogo (K1/K2), especializa-se numa função (passador, central, ponta) e ajusta a tática em função do adversário."},{"m":"Basquetebol","I":"Em jogo 3x3 (campo reduzido) ou 5x5, recebe a bola enquadrado ofensivamente, lança na passada ou parado de curta distância, dribla para progredir ou ultrapassar o adversário direto, passa a companheiro desmarcado, desmarca-se criando linhas de passe, defende o adversário direto e participa no ressalto.","E":"Em jogo 5x5, no contra-ataque desmarca-se oferecendo linha de passe e progride em drible pelo corredor central; ao receber a bola, enquadra-se e opta por lançamento, drible para finalizar ou passe a companheiro desmarcado; sem bola, desmarca-se para o cesto e participa no ressalto ofensivo; na defesa individual, dificulta drible, passe e lançamento e participa no ressalto defensivo.","A":"Em jogo formal, cria e explora situações de vantagem numérica e posicional, lê e adapta o sistema defensivo/ofensivo à equipa adversária."},{"m":"Andebol","I":"Em jogo de Andebol de 5 (campo reduzido, baliza baixa), desmarca-se oferecendo linha de passe, opta por passe armado ou drible em progressão, finaliza em remate em salto junto à área e defende procurando intercetar ou dificultar o remate do adversário; como guarda-redes, enquadra-se com a bola e inicia o contra-ataque.","E":"Em jogo 5x5 ou 7x7, no contra-ataque desmarca-se rapidamente oferecendo linhas de passe ofensivas e finaliza em remate em salto explorando vantagem numérica; sem vantagem imediata, mantém a posse com desmarcações e ultrapassagens 1x1; na defesa individual, faz marcação de proximidade e de vigilância; como guarda-redes, inicia o contra-ataque direto ou apoiado.","A":"Em jogo formal, aplica sistemas ofensivos e defensivos organizados (ataque posicional, defesa 5:1/3:2:1), adaptando-os ao adversário."},{"m":"Futebol","I":"Em jogo de Futebol 4x4 (espaço amplo, com guarda-redes), recebe e controla a bola, remata se tem a baliza ao alcance, passa a companheiro desmarcado ou conduz a bola para rematar, desmarca-se criando linhas de passe e marca o adversário direto na defesa.","E":"Em jogo 5x5 ou 7x7, recebe e enquadra-se ofensivamente, finta para se libertar da marcação e opta por rematar, passar a companheiro desmarcado ou conduzir a bola em progressão; desmarca-se com fintas e mudanças de direção garantindo largura e profundidade ao ataque; na defesa, marca o atacante; como guarda-redes, enquadra-se com a bola e inicia o ataque após recuperar a posse.","A":"Em jogo formal, aplica sistemas táticos coletivos (ocupação racional do terreno, pressão alta, transições rápidas), adaptando-os à equipa adversária."},{"m":"Ginástica de Solo","I":"Combina numa sequência: cambalhota à frente terminando a pés juntos, cambalhota à frente em plano inclinado com pernas afastadas, cambalhota à retaguarda com saída de pernas afastadas ou pés juntos, passagem por pino seguida de cambalhota à frente, subida para pino e roda com apoio alternado das mãos.","E":"Elabora e executa uma sequência de solo com fluidez, combinando cambalhota à frente terminando em equilíbrio, cambalhota à frente saltada após corrida e chamada a pés juntos, cambalhota à retaguarda terminando em equilíbrio, pino de braços seguido de cambalhota à frente, roda com saída em equilíbrio, avião, posições de flexibilidade (ponte, espargata) e elementos de ligação (saltos, voltas, afundos); em exercício, executa também rodada e cambalhota à retaguarda com passagem por pino.","A":"Compõe e executa uma sequência de solo com elementos de maior dificuldade (ex.: flic-flac assistido, elementos acrobáticos ligados), com amplitude, fluidez e expressividade."},{"m":"Ginástica de Aparelhos (Trampolins)","I":"Após corrida de balanço e chamada a pés juntos, executa salto de eixo e salto entre-mãos no boque/plinto e cambalhota à frente no plinto longitudinal; no mini-trampolim, executa o salto em extensão (vela) após corrida de balanço ou após saltos de impulsão.","E":"No mini-trampolim, após corrida de balanço ou saltos de impulsão, executa salto em extensão, salto engrupado, pirueta vertical e carpa de pernas afastadas; progride para ¾ de mortal à frente engrupado e ¼ de mortal à retaguarda, com receção em colchão elevado; no plinto, executa salto de eixo e salto entre-mãos com maior amplitude de voo.","A":"Compõe e executa uma sequência de saltos combinados (rotações e piruetas) com fluidez, altura de voo e segurança, sem apoio externo."},{"m":"Atletismo","I":"Corrida de velocidade (40m) com partida de pé; salto em altura com técnica de tesoura, com quatro a seis passadas de balanço.","E":"Corrida de velocidade (40-60m) com partida de tacos, acelerando até à velocidade máxima com apoios ativos; salto em altura com técnica de Fosbury Flop, com cinco a oito passadas de balanço.","A":"Otimiza o resultado nas provas de velocidade e salto em altura através do aperfeiçoamento técnico individualizado, aproximando-se de referências de desempenho por escalão/género."},{"m":"Natação","I":"Em piscina com pé, coordena inspiração e expiração pela boca e pelo nariz; flutua em equilíbrio nas posições ventral e dorsal, combinando mudanças de posição; associa o mergulho à flutuação para se deslocar com intencionalidade; desloca-se coordenando pernas, braços e respiração; salta para a piscina a partir de posições variadas.","E":"Coordena e combina a inspiração/expiração em situações propulsivas complexas de braços e pernas; realiza a respiração dos estilos crawl e costas associada aos movimentos propulsivos; desloca-se em posição dorsal e ventral, diferenciando entrada das mãos, trajeto propulsivo e recuperação, com ritmo e velocidade adequados; salta de cabeça a partir da posição de pé, com extensão do corpo; salta a partir de pé para zona funda, executando rotações em trajetória aérea.","A":"Nada os quatro estilos com eficiência técnica e ritmo constante em distâncias de referência, com partidas e viragens regulamentares."},{"m":"Softbol","I":"Em jogo formal simplificado, executa as ações defensivas e ofensivas fundamentais (receção, lançamento, batimento, corrida de bases).","E":"Em jogo formal, desempenha as várias posições defensivas com decisão tática sobre a base de destino, lança como pitcher com trajetória regulamentar, e no ataque decide bater ou avançar consoante a situação de jogo e o número de eliminados.","A":"Em jogo formal, aplica estratégias ofensivas e defensivas avançadas (ex.: squeeze play, dupla eliminação), adaptando a decisão à leitura do jogo."},{"m":"Dança","I":"Desloca-se por toda a área combinando andar, correr, saltitar, deslizar, saltar, rolar, etc., ajustado à marcação rítmica; realiza equilíbrios e acentua estímulos musicais com movimentos; em grupo, segue formações (rodas, linhas, ziguezague); cria pequenas sequências de movimento, a pares ou em grupo, e apresenta-as com ambiente musical.","E":"Aperfeiçoa sequências de saltos e voltas no lugar (variando apoios e amplitude) e sequências de passos combinados com voltas e poses; em grupo, segue formações mais complexas (linhas retas, quebradas, curvas); a pares/trios, conduz e segue o companheiro com qualidades de movimento idênticas ou contrárias; cria e apresenta composições e projetos coreográficos, individuais, a pares ou em grupo.","A":"Cria uma coreografia original, integrando composição, técnica e expressividade, adaptando-a a diferentes estilos ou géneros musicais."},{"m":"Badminton","I":"Em cooperação a cerca de 6m, mantém posição base e desloca-se para devolver o volante sem o deixar cair, distinguindo pegas de direita/esquerda; executa clear (trajetórias altas) e lob (trajetórias baixas, em afundo); em exercício, executa o serviço curto e comprido.","E":"Em jogo de singulares, desloca-se e devolve o volante com serviço curto/comprido na diagonal, clear, lob, amorti (à direita e à esquerda, junto à rede) e drive (batimento à frente do corpo com trajetória tensa); em exercício, remata na sequência do serviço alto do companheiro, com trajetória descendente.","A":"Em jogo de singulares e pares, aplica um plano tático completo (variação de ritmo, exploração de espaços), adaptando-o ao estilo do adversário."},{"m":"Judo/Luta","I":"Em luta no solo, aproveita situações de vantagem para tentar o assentamento de espáduas, aplicando dupla prisão de pernas com rotação, prisão de braço por dentro ou dupla prisão de braços; em guarda a quatro, desloca-se em quadrupedia procurando o enquadramento frontal ou a posição de pé; em luta em pé, aplica controlos (cabeça e braço, braço por dentro, dupla prisão de pernas) e projeções (barreira exterior, projeção anterior, braço rolado).","E":"Em luta no solo, cria e aproveita vantagem nítida para o assentamento de espáduas com dupla prisão de pernas, prisão de braço por dentro, dupla prisão de braços ou pernas cruzadas, aplicando finalizações de controlo; em guarda a quatro, executa a passagem para cima a partir do controlo pela cintura; em pé, aplica controlos e projeções (barreira exterior, braço rolado, projeção anterior) e desequilíbrio à retaguarda a partir do controlo da perna por dentro.","A":"Em combate, aplica um repertório técnico-tático diversificado e adaptado ao adversário, com controlo, decisão tática e total respeito pelas regras de segurança."},{"m":"Patinagem","I":"Em patins, arranca para a frente/esquerda/direita, desliza sobre um apoio (figura \"Quatro\"), desliza para trás após impulso, desliza de cócoras, desenha \"oitos\", curva com pés paralelos, trava em T e faz meia volta em deslocamento.","E":"Realiza um percurso e uma composição em pares/trios com música: patina para a frente em apoio alternado, desliza para a frente e para trás sobre um patim, desliza para trás cruzando as pernas, executa curvas com cruzamento de pernas, trava em T e em deslize para trás, desliza em posição de \"águia\" e inverte o sentido, faz meia volta/volta em deslocamento e saltos a um ou dois pés sobre obstáculos.","A":"Executa uma sequência de deslocamento com elementos técnicos combinados e maior grau de dificuldade, ou participa em jogo formal sobre patins com decisão tática."},{"m":"Ginástica Acrobática","I":"A par, combina numa coreografia com música (até 2 minutos), afundos, piruetas, rolamentos, passo-troca-passo, tesouras (saltos) e posições de equilíbrio, integrando elementos técnicos de base/volante: prancha facial do volante apoiada nos pés do base (deitado dorsal); pino do volante apoiado entre as coxas do base sentado; equilíbrio de pé do volante numa coxa do base (pega simples); cambalhota à frente a dois (tank); e monte lateral com equilíbrio de pé nos ombros do base; em trios, realiza elementos técnicos equivalentes (ex.: prancha dorsal apoiada por dois bases, voo com receção nos braços dos bases) com coordenação e fluidez.","E":"A par, combina numa coreografia musicada (até 2 minutos) destrezas de ligação com maior exigência técnica: prancha facial do volante apoiada na bacia sobre os pés do base (pernas do base perpendiculares ao solo); equilíbrio de pé do volante sobre as coxas do base (de frente ou de costas), com desmonte em braços elevados; equilíbrio de pé nos ombros do base em pé (\"coluna\"), com desmonte em salto após pega de mãos; em trios, realiza elementos técnicos equivalentes com maior exigência (base intermédio a apoiar a estrutura, ou volante a apoiar simultaneamente outro base em pino) com coordenação e fluidez.","A":"Compõe e executa uma coreografia acrobática original a pares/trios, com maior grau de dificuldade nos elementos técnicos, sincronização musical e expressividade."},{"m":"Danças Sociais","I":"A pares, domina a postura, distingue \"Posição Fechada\" de \"Posição Aberta\" e os princípios básicos de condução (condutor/seguidor); dança o Merengue e a Rumba Quadrada (danças latino-americanas/não progressivas), realizando passos no lugar, laterais, cruzados e voltas; dança a Valsa Lenta e o Foxtrot Social (formas simplificadas, progressivas), respeitando o alinhamento espacial e o sentido inverso de progressão.","E":"A pares, dança a Rumba Quadrada, o Chá-Chá-Chá, o Rock (forma simplificada de jive) e a Salsa (danças latino-americanas/não progressivas), em posições abertas e em \"Posição Fechada sem contacto\", incluindo voltas, promenades e mudanças de posição; dança ainda a Valsa Lenta (forma social), o Foxtrot Social e o Tango (danças modernas/progressivas), em \"Posição Fechada com contacto\", dominando o alinhamento espacial, o sentido de progressão e as figuras de canto/promenade.","A":"Cria e apresenta, a pares, uma sequência coreográfica que combine várias danças sociais trabalhadas, com fluidez, condução e qualidade técnica."},{"m":"Danças Tradicionais","I":"Conhece a origem cultural e histórica das danças selecionadas; dança o Regadinho, a Erva Cidreira (simplificada, sem escovinha) e o Sariquité, executando o \"passo de passeio\", o \"passo saltado\", o \"passo saltitado\" e o \"passo corrido\" em sincronia com a música e respeitando as posturas e posições próprias de cada dança.","E":"Analisa a sua ação e a dos companheiros; dança a Vai de Roda Siga a Roda (simplificada, só com a roda grande), o Malhão Minhoto e o Tacão e Bico, executando o \"passo gingão lateral\", o \"passo serrado\", o \"passo de malhão\" e o \"passo tacão e bico\" com qualidade técnica e em sincronia com a música.","A":"Apresenta, com o grupo, uma dança tradicional completa com qualidade técnica, sincronização e conhecimento do seu enquadramento cultural."},{"m":"Ténis de Mesa","I":"Em situação de exercício, posiciona-se corretamente junto ao meio da mesa, mantém a pega clássica (shakehand), inicia o jogo deixando cair a bola para a bater de seguida, devolve a bola (à esquerda e à direita) com trajetória rasante sobre a rede e executa o serviço curto e comprido, colocando a bola para além da rede ou junto à linha de fundo, à esquerda ou à direita.","E":"Em jogo de singulares, inicia o jogo com serviço curto ou comprido colocando a bola numa zona de difícil receção, devolve a bola dificultando a ação do adversário com diferentes direções e trajetórias, e desloca-se e recupera a posição base após cada batimento; em exercício, executa o serviço com corte superior ou inferior (de direita e de revés) e realiza sequências de batimentos combinando trajetórias paralela e diagonal.","A":"Em jogo de singulares, combina serviço, ataque e defesa com decisão tática, explorando as zonas de maior dificuldade para o adversário."},{"m":"Orientação","I":"Coopera com o parceiro na realização de um percurso de orientação simples, segundo um mapa (croqui ou planta), preenchendo corretamente o cartão de controlo; identifica a simbologia básica da carta, orienta o mapa com auxílio da bússola, identifica a sua localização e escolhe a melhor opção de percurso para cumprir os postos de passagem o mais rapidamente possível.","E":"Realiza, em pares, um percurso de orientação fora da escola, o mais rápido possível, com o cartão de controlo corretamente preenchido, segundo um mapa de escala adequada (até 1:5000) e com auxílio da bússola; interpreta a simbologia da altimetria, planimetria, hidrografia e vegetação, calcula distâncias pela escala do mapa e seleciona, em percurso de opção múltipla, o trajeto mais vantajoso em tempo e esforço.","A":"Planeia e realiza, com autonomia, um percurso de orientação em terreno variado, otimizando a escolha de rota em função do tempo e do esforço."},{"m":"Jogos Tradicionais Populares","I":"Conhece o contexto sócio-histórico de jogos tradicionais regionais selecionados pelo professor ou apresentados por grupos da turma e coopera com os companheiros na sua prática, seguindo as regras específicas de cada jogo.","E":"Coopera com os companheiros na prática de jogos tradicionais regionais, aplicando com correção os padrões técnicos característicos de cada jogo e as respetivas regras específicas, participando na organização e apresentação da atividade à turma.","A":"Organiza e dinamiza, com autonomia, a apresentação de um jogo tradicional à turma, incluindo o seu enquadramento sócio-histórico."}],"AV":{"pont":["4 ou mais faltas de assiduidade/pontualidade.","2 ou 3 faltas de assiduidade/pontualidade.","1 falta de assiduidade/pontualidade.","Sem faltas de assiduidade nem atrasos."],"mat":["4 ou mais faltas de material.","2 ou 3 faltas de material.","1 falta de material.","Sem faltas de material."],"resp":["Comportamento rude, não respeita materiais. Não toma responsabilidade pelas suas ações.","Só trabalha com alguns grupos e/ou modalidades.","Demonstra respeito pelos outros e pelo equipamento.","Demonstra respeito pelos outros e colabora na preservação do equipamento."],"emp":["Sem entusiasmo, desiste, desmotiva e requer constante incentivo.","Pouco entusiasmo, desanima. Requer incentivos com regularidade.","Motivado, persistente, necessita de incentivo quando tem percalços.","Motivado, persistente, procura superar-se autonomamente."],"lid":["Não ajuda. Crítico dos outros.","Aceita responsabilidade apenas se indicado. Ignora os outros e as suas dificuldades.","Atua de forma positiva e incentiva os colegas. Age com liderança quando solicitado.","Modelo a seguir. Ajuda os colegas. Age com liderança, tomando a iniciativa."]}};

function gApply(val, advance) {
  const {c, col, al} = gHere(); if (!col || !al || !gEditable(col, al)) return;
  gSnap(c, col); gSet(c, col, al, val);
  if (PIN && val != null && col.type !== 'reg') { PIN = {type:col.type, val, label:(gChoices(col) || []).find(x => x.v === val)?.label || String(val)}; }
  if (advance && !PIN && col.type !== 'reg') gMove(1, 0); else gRefresh();
}
function gFill(k, val) {
  const {t, c} = gHere(), col = gCols(t, c.v).find(x => x.k === k); if (!col) return 0;
  gSnap(c, col); let n = 0;
  alunosOf(t).forEach(al => { if (!gEditable(col, al)) return; const has = val == null ? gGet(c, col, al) != null : gFilled(c, col, al) && !gShow(c, col, al).auto; if (val == null ? has : !has) { gSet(c, col, al, val); n++; } });
  if (!n) { UNDOS.pop(); UNDO = UNDOS[UNDOS.length - 1] || null; } return n;
}

function sheetCol(k) {
  const t = turma(), c = gCtx(t), col = gCols(t, c.v).find(x => x.k === k); if (!col) return;
  const ch = gChoices(col), canEdit = col.type !== 'calc' && col.type !== 'reg';
  let b = '<div class="form">';
  if (col.m && !col.ind) b += aeBox(t);
  if (col.k === 'con' && AE[anoOf(t)]) b += `<div class="aebox"><b>Conhecimentos · Aprendizagens Essenciais do ${anoOf(t)}.º ano</b>${AE[anoOf(t)].con.map(x => `<div>• ${esc(x)}</div>`).join('')}<div><span class="ae1 pill">Proficiente</span> ${AE_CON_P}</div><div><span class="ae2 pill">${esc(aeTop(AE[anoOf(t)]))}</span> ${AE_CON_E}</div></div>`;
  if (col.m) {
    const d = (PNEF[t.ciclo] || []).find(x => x.m === col.m);
    if (col.ind) b += `<p class="hint">Indicador de <b>${esc(col.m)}</b>. A média dos indicadores dá o nível da matéria quando este não é escolhido à mão.</p>`;
    b += `<details class="desc"${col.ind ? '' : ' open'}><summary>Descritivos PNEF · ${esc(col.m)}</summary>${d ? `<dl>${['I','E','A'].map(x => `<dt>${x} · ${LVN[x]}</dt><dd>${esc(d[x] || '—')}</dd>`).join('')}</dl>` : '<p class="hint">Sem descritivo neste ciclo.</p>'}</details>`;
    if (!col.ind) {
      const inds = (c.v.ind || {})[col.m] || [], prev = UI.p > 1 ? ((avalOf(t.id, UI.p - 1).ind || {})[col.m] || []) : [];
      b += `<div class="field"><span class="lbl">Indicadores de desempenho</span><p class="hint">Divida a matéria em indicadores (ex.: passe, manchete, jogo 2x2). Cada um ganha uma coluna; o nível da matéria passa a ser a média, a não ser que o escolha à mão.</p>
        ${inds.length ? `<div class="list">${inds.map(i => `<div class="li"><span class="who nm">${esc(i.n)}</span><button class="btn danger" data-a="ind-del" data-m="${esc(col.m)}" data-id="${esc(i.id)}">Remover</button></div>`).join('')}</div>` : ''}
        <div style="display:flex;gap:8px"><input type="text" id="ind-new" placeholder="Novo indicador" aria-label="Novo indicador"><button class="btn" data-a="ind-add" data-m="${esc(col.m)}">Adicionar</button></div>
        ${!inds.length && prev.length ? `<button class="link" style="align-self:flex-start" data-a="ind-copy" data-m="${esc(col.m)}">Usar os indicadores do ${perLabel(UI.p - 1, true)} (${prev.map(i => esc(i.n)).join(', ')})</button>` : ''}</div>`;
    }
  }
  if (canEdit && ch) b += `<div class="field"><span class="lbl">Preencher os vazios da turma com</span><div class="gbr">${ch.map(x => `<button class="lv ${x.cls}" data-a="col-fill" data-k="${esc(k)}" data-v="${x.v}" title="${esc(x.title || '')}">${esc(x.label)}</button>`).join('')}</div></div>`;
  if (col.ak === 'emp') b += `<button class="btn" data-a="col-reg">Sugerir o Empenho pelos registos +/− das aulas</button>`;
  b += `<div class="field"><span class="lbl">Ordenar os alunos</span><div class="btn-row"><button class="btn" data-a="col-sort" data-k="${esc(k)}" data-d="-1">Do maior para o menor</button><button class="btn" data-a="col-sort" data-k="${esc(k)}" data-d="1">Do menor para o maior</button>${UI.sort ? '<button class="btn" data-a="col-sort" data-d="0">Pelo n.º</button>' : ''}</div></div>`;
  if (canEdit) b += `<button class="btn danger" data-a="col-clear" data-k="${esc(k)}">Limpar esta coluna</button>`;
  openSheet(col.title, b + '</div>');
}

function vPauta(t) {
  const als = alunosOf(t); const ms = matsOf(t, UI.p);
  const rows = als.map(al => ({al, r: calc(t, UI.p, al)}));
  const nA = rows.filter(x => x.r.EST === 'Apto').length, nN = rows.filter(x => x.r.EST === 'Não apto').length, nI = rows.length - nA - nN;
  const seg = `<div class="seg block" role="group" aria-label="Vista">${[['pauta','Pauta'],['graf','Gráficos'],['rel','Documentos']].map(([k, n]) => `<button data-a="pview" data-k="${k}" class="${(UI.pview || 'pauta') === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if (UI.pview === 'graf') return `<div class="stack">${seg}${vGraficos(t)}</div>`;
  if (UI.pview === 'rel') return `<div class="stack">${seg}${vDocs(t)}</div>`;
  let h = `<div class="stack">${seg}<div class="sec-h"><h2>Pauta · ${perLabel(UI.p, true)}</h2><span class="muted small">${ms.length} ${ms.length === 1 ? 'matéria' : 'matérias'}</span></div>`;
  h += `<div class="tiles"><div class="tile"><b>${rows.length}</b><span>Alunos</span></div><div class="tile ok"><b>${nA}</b><span>Aptos</span></div><div class="tile bad"><b>${nN}</b><span>Não aptos</span></div><div class="tile"><b>${nI}</b><span>Incompletos</span></div></div>`;
  if (!rows.length) return h + `<div class="card empty"><h3>Sem alunos</h3><p>A pauta aparece quando a turma tiver alunos.</p></div></div>`;
  const cell = (x, cls) => `<td class="${x != null && x < 10 ? 'low' : ''} ${cls || ''}">${f1(x)}</td>`;
  h += `<div class="tbl-wrap"><table><thead><tr><th>Nº</th><th class="l">Aluno</th><th>AF</th><th>Apt.</th><th>Con.</th><th>Atit.</th><th>Final</th>${t.ciclo !== 'S' ? '<th>' + nivelLbl(t) + '</th>' : ''}<th>Estado</th>${AE[anoOf(t)] ? '<th title="Aprendizagens Essenciais: atividades físicas / aptidão física / conhecimentos">AE</th>' : ''}<th>F</th></tr></thead><tbody>`;
  rows.forEach(({al, r}) => {
    h += `<tr class="click" data-a="aluno-edit" data-id="${esc(al.id)}"><td>${esc(al.num ?? '')}</td><td class="l nm">${esc(al.nome)}</td>${r.afOn ? cell(r.AF) : '<td class="muted">n/a</td>'}${r.apfOn ? cell(r.APF) : '<td class="muted">n/a</td>'}${cell(r.CON)}${cell(r.AV)}<td class="fin ${r.FIN != null && r.FIN < 10 ? 'low' : ''}">${r.FIN ?? '—'}</td>${t.ciclo !== 'S' ? `<td><b>${esc(nivel(t, r.FIN) ?? '—')}</b></td>` : ''}<td><span class="pill ${r.EST === 'Apto' ? 'ok' : r.EST === 'Não apto' ? 'bad' : 'inc'}">${r.EST}</span></td>${(ae => ae ? `<td class="aecell" title="${esc('Atividades físicas: ' + aeLbl(ae, ae.af) + ' · Aptidão física: ' + aeLbl(ae, ae.apf) + ' · Conhecimentos: ' + aeLbl(ae, ae.con))}">${[ae.af, ae.apf, ae.con].map(x => `<span class="${aeCls(x)} pill">${aeShort(ae, x)}</span>`).join(' ')}</td>` : '')(aeOf(t, al, UI.p))}<td>${r.c.F || ''}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<p class="hint">Regra da grelha: se algum domínio aplicável ficar abaixo de 10, a nota final fica limitada a 9 (Não apto). Toque num aluno para ver o detalhe.</p>`;
  h += `<button class="btn primary block" data-a="xlsx">Exportar pauta, sumários e presenças (Excel)</button></div>`;
  return h;
}

function vMais(t) {
  const ts = Object.values(S.turmas).sort((a, b) => a.nome.localeCompare(b.nome, 'pt', {numeric:true}));
  let h = `<div class="stack">`;

  h += `</div>`;
  h += `<div class="sec-h"><h2>Ano letivo</h2></div><div class="card form">
    <div class="grid2"><div class="field"><label for="cfg-ano">Ano letivo</label><input id="cfg-ano" type="text" data-in="cfg-ano" value="${esc(CFG.ano)}"></div>
    <div class="field"><span class="lbl">Organização</span><div class="seg block">${[[3,'Períodos'],[2,'Semestres']].map(([n, l]) => `<button data-a="nper" data-n="${n}" class="${CFG.nper === n ? 'on' : ''}">${l}</button>`).join('')}</div></div></div>
    ${CFG.per.slice(0, CFG.nper).map((p, i) => `<div class="grid2"><div class="field"><label for="per-${i}-ini">${perLabel(i + 1, true)}: início</label><input type="date" id="per-${i}-ini" data-in="per" data-i="${i}" data-k="ini" value="${esc(p.ini)}"></div><div class="field"><label for="per-${i}-fim">fim</label><input type="date" id="per-${i}-fim" data-in="per" data-i="${i}" data-k="fim" value="${esc(p.fim)}"></div></div>`).join('')}
    <p class="hint">As aulas entram no período pela data. Confirme as datas com o calendário da sua escola.</p></div>`;
  const f = FIT.find(x => x.k === UI.fitref && !x.bool) || FIT[0];
  const ref = CFG.fit[f.k];
  h += `<div class="sec-h"><h2>Tabelas FITescola</h2></div><div class="card form">
    <div class="chips">${FIT.filter(x => !x.bool).map(x => `<button class="chip ${x.k === f.k ? 'on' : ''}" data-a="fitref-sel" data-k="${x.k}">${esc(x.n)}</button>`).join('')}</div>
    <p class="hint">${esc(f.n)} (${esc(f.u)}) · ${f.dir > 0 ? 'mais é melhor' : 'menos é melhor'} · origem: <b>${esc(ref.src || '—')}</b></p>
    <div class="tbl-wrap"><table class="ref"><thead><tr><th>Idade</th><th>Rapazes ZS</th><th>Rapazes ZA</th><th>Raparigas ZS</th><th>Raparigas ZA</th></tr></thead><tbody>
    ${[0,1,2,3,4,5,6,7,8].map(i => `<tr><td><b>${i === 8 ? '18+' : 10 + i}</b></td>${['M','F'].map(sx => ['zs','za'].map(z => `<td><input type="text" inputmode="decimal" data-in="fitref" data-k="${f.k}" data-sx="${sx}" data-z="${z}" data-i="${i}" value="${esc(ref[sx][z][i] ?? '')}" aria-label="${sx === 'M' ? 'Rapazes' : 'Raparigas'} ${z.toUpperCase()} ${10 + i} anos"></td>`).join('')).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="note warn">Confirme estes valores com a tabela oficial do FITescola (DGE). Vaivém, abdominais e senta e alcança vêm da tabela FITescola; as flexões são provisórias; velocidade, agilidade e impulsão estão por preencher. Sem valor, a zona escolhe-se à mão. Abaixo dos 10 anos não há referência.</p></div>`;
  h += `<div class="sec-h"><h2>Todas as turmas</h2></div><div class="card form"><p class="hint" style="margin:0">Médias, aptos, aptidão física e faltas de todas as turmas lado a lado, com gráficos: útil para o grupo de Educação Física e o conselho pedagógico.</p><button class="btn" data-a="grupo">Painel de todas as turmas · ${perLabel(UI.p)}</button></div>`;
  h += `<div class="sec-h"><h2>Horário semanal</h2></div><div class="card form">${vHorarioSemana()}<p class="hint" style="margin:0">Com o horário definido, o ecrã das aulas mostra as turmas do dia e abre a aula certa com um toque.</p></div>`;
  const nv = CFG.niv || [4, 10, 14, 18];
  h += `<div class="sec-h"><h2>Escola e relatórios</h2></div><div class="card form">
    <div class="grid2"><div class="field"><label for="cfg-escola">Escola / agrupamento</label><input type="text" id="cfg-escola" data-in="cfg-txt" data-k="escola" value="${esc(CFG.escola || '')}"></div><div class="field"><label for="cfg-prof">Professor(a)</label><input type="text" id="cfg-prof" data-in="cfg-txt" data-k="prof" value="${esc(CFG.prof || '')}"></div></div>
    <div class="field"><span class="lbl">Conversão da classificação 0–20 em nível 1–5 (2.º e 3.º ciclos) e menção (1.º ciclo)</span><div class="tbl-wrap"><table class="ref"><thead><tr><th>Nível 2 a partir de</th><th>Nível 3</th><th>Nível 4</th><th>Nível 5</th></tr></thead><tbody><tr>${nv.map((x, i) => `<td><input type="text" inputmode="decimal" data-in="cfg-niv" data-i="${i}" value="${x}" aria-label="Limite do nível ${i + 2}"></td>`).join('')}</tr></tbody></table></div><p class="hint" style="margin:0">Por defeito: 1 (0–3), 2 (4–9), 3 (10–13), 4 (14–17), 5 (18–20). Ajuste aos critérios aprovados na sua escola.</p></div>
    <div class="field"><span class="lbl">Aprendizagens Essenciais · Conhecimentos (a escala das AE é descritiva; indique a partir de que classificação 0–20 considera)</span><div class="grid2">${['Proficiente', 'Elevado / Avançado'].map((n, i) => `<div class="field"><label for="aecon-${i}">${n} a partir de</label><input type="text" inputmode="decimal" id="aecon-${i}" data-in="cfg-aecon" data-i="${i}" value="${(CFG.aeCon || [10, 14])[i]}"></div>`).join('')}</div></div>
    <button class="btn" data-a="doc-crit">Critérios de avaliação (imprimir ou PDF)</button></div>`;
  h += `<div class="sec-h"><h2>Cópia de segurança</h2></div><div class="card form">
    <p class="note">${esc(storageNote())}</p>
    ${Store.local ? `<p class="hint">Última cópia: ${lastBackup() ? esc(fmtDate(lastBackup(), {day:'numeric', month:'long', year:'numeric'})) : 'nunca'}. Guarde o ficheiro no OneDrive ou no email.</p>` : ''}
    <div class="btn-row"><button class="btn" data-a="backup">Exportar cópia (.json)</button><button class="btn" data-a="restore">Importar cópia</button></div>
    ${t ? `<button class="btn" data-a="xlsx">Exportar ${esc(t.nome)} · ${perLabel(UI.p)} para Excel</button>` : ''}</div>`;
  h += `<div class="sec-h"><h2>Regras de cálculo</h2></div><div class="card small" style="display:grid;gap:6px">
    ${Object.entries(REG).map(([k, r]) => `<div><b>${k}</b>: ${r.af ? 'AF ' + r.af * 100 + '% · Apt. ' + r.apf * 100 + '% · ' : ''}Con. ${r.con * 100}% · Atit. ${r.av * 100}%</div>`).join('')}
    <div class="muted">Níveis: NI 4 · PI 8 · I 11 · PE 13 · E 15 · PA 17 · A 19 (média das matérias avaliadas no período). Aptidão física: soma dos pontos + 5, máx. 20.</div></div>`;
  return h + '</div>';
}

/* ---------- sheets ---------- */
function openSheet(title, body, foot) {
  $('#sheet').innerHTML = `<div class="sh-back" data-a="sh-close"></div><section class="sh" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sh-h"><h2>${esc(title)}</h2><button class="icon-btn" data-a="sh-close" aria-label="Fechar">×</button></header><div class="sh-b">${body}</div>${foot ? `<footer class="sh-f">${foot}</footer>` : ''}</section>`;
  $('#sheet').hidden = false; document.body.classList.add('locked');
}
function closeSheet() { stopTool(); $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('locked'); UI.draft = null; DFOTO = undefined; }
function updSheet(body, foot) { const b = $('#sheet .sh-b'), f = $('#sheet .sh-f'); if (b) b.innerHTML = body; if (f) f.innerHTML = foot; }
function armed(el, label) { if (el.dataset.armed) return true; el.dataset.armed = '1'; el.classList.add('armed'); const o = el.textContent; el.textContent = label; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.classList.remove('armed'); el.textContent = o; } }, 4000); return false; }

function sheetAula(a) {
  const t = turma(); const isNew = !S.aulas[a.id];
  UI.draft = a;
  const all = aulasOf(t.id); const n = isNew ? all.filter(x => x.data <= a.data).length + 1 : all.findIndex(x => x.id === a.id) + 1;
  const last = all.filter(x => x.id !== a.id && x.sumario).pop();
  const body = `<div class="form">
    <div class="grid2"><div class="field"><label for="d-data">Data</label><input type="date" id="d-data" data-in="d-data" value="${esc(a.data)}"></div>
    <div class="field"><span class="lbl">Lição</span><div class="licao" style="padding-top:8px">N.º <span class="num-t">${n}</span> <span class="muted small" style="font-family:var(--f-body);font-weight:500">· ${perLabel(periodOf(a.data), true)}</span></div></div></div>
    <div class="field"><span class="lbl">Matérias da aula</span><div class="chips">${(MATS[t.ciclo] || GR).map(m => `<button class="chip ${a.materias.includes(m) ? 'on' : ''}" data-a="d-mat" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>
    <div class="field"><label for="d-sum">Sumário</label><textarea id="d-sum" data-in="d-sum" placeholder="Ex.: Voleibol: passe e manchete em situação de 2x2. Condição física: resistência.">${esc(a.sumario)}</textarea>
    <div class="sug">${[...a.materias.flatMap(m => SUMB[m] || []), ...SUMG].map(x => `<button data-a="d-sug" data-t="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    ${last ? `<button class="link" style="align-self:flex-start" data-a="d-last">Copiar o sumário da lição anterior</button>` : ''}</div>
    <button class="btn block" data-a="aula-aval">Avaliar nesta aula: níveis e registos +/−</button>
    <div class="field"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Presenças</span><button class="link" data-a="d-allp">Todos presentes</button></div>
    <div class="legend">${PS.map(k => `<span><b>${k}</b> ${PSN[k]}</span>`).join('')}</div>
    <div class="list">${alunosOf(t).map(al => { const s = a.presencas[al.id] || 'P'; return `<div class="pr"><span class="n">${esc(al.num ?? '')}</span>${avatar(al, 'sm')}<span class="nm">${esc(al.nome)}</span><span class="ps" role="group" aria-label="Presença de ${esc(al.nome)}">${PS.map(k => `<button class="${k} ${s === k ? 'on' : ''}" data-a="d-pres" data-aid="${esc(al.id)}" data-s="${k}" title="${PSN[k]}" aria-pressed="${s === k}">${k}</button>`).join('')}</span></div>`; }).join('') || '<div class="empty">Sem alunos na turma.</div>'}</div></div>
  </div>`;
  const foot = (isNew ? '' : `<button class="btn danger" data-a="aula-del">Eliminar</button>`) + `<button class="btn primary" data-a="aula-save">Guardar aula</button>`;
  openSheet(isNew ? 'Nova aula' : 'Lição ' + n, body, foot);
}

function sheetAluno(al) {
  const t = turma(); const isNew = !(t.alunos || []).some(x => x.id === al.id); UI.draft = al;
  let resumo = '';
  if (!isNew) {
    resumo = fig('Retrato · ' + perLabel(UI.p, true), 'Domínios face à média da turma e competências dominadas', retrato(t, UI.p, al));
    resumo += '<div class="field"><span class="lbl">Resumo por período</span><div class="tbl-wrap"><table><thead><tr><th class="l">Período</th><th>AF</th><th>Apt.</th><th>Con.</th><th>Atit.</th><th>Final</th><th>F</th><th>A</th><th>s/M</th></tr></thead><tbody>' +
      CFG.per.slice(0, CFG.nper).map((_, i) => { const r = calc(t, i + 1, al); return `<tr><td class="l">${perLabel(i + 1)}</td><td>${r.afOn ? f1(r.AF) : 'n/a'}</td><td>${r.apfOn ? f1(r.APF) : 'n/a'}</td><td>${f1(r.CON)}</td><td>${f1(r.AV)}</td><td class="fin">${r.FIN ?? '—'}</td><td>${r.c.F}</td><td>${r.c.A}</td><td>${r.c.M}</td></tr>`; }).join('') + '</tbody></table></div>';
    const r = calc(t, UI.p, al);
    const lv = Object.entries(r.lv);
    resumo += `<p class="hint">${perLabel(UI.p, true)}: ${lv.length ? lv.map(([m, l]) => esc(m) + ' ' + l).join(' · ') : 'sem matérias avaliadas'}${r.missing.length ? ' · Falta: ' + r.missing.join(', ') : ''}</p></div>`;
    if (lv.length) resumo += `<div class="field"><span class="lbl">O que domina e onde melhorar · ${perLabel(UI.p, true)}</span>${lv.map(([m, l]) => { const sm = lvSummary(t.ciclo, m, l, tksOf(avalOf(t.id, UI.p), al.id, m)); return `<details class="desc"><summary>${esc(m)} · ${l} <span class="muted small">(${esc(LVN[l])})</span></summary>${sm ? `<div class="dom" style="max-height:none;margin-bottom:12px">${sm}</div>` : '<p class="hint">Sem descritivo neste ciclo.</p>'}</details>`; }).join('')}</div>`;

      let num = null, nome = '', sexo = '', nasc = '';
      parts.forEach(p => {

        else if (/^[FM]$/i.test(p)) sexo = p.toUpperCase();

/* ---------- histórico de alterações e desfazer ---------- */
// Cada avaliação gravada é comparada com a versão anterior; as diferenças ficam registadas por turma (quem, o quê, de, para, quando).
const SHADOW = {}, UNDOS = [];
const HLAB = {af:'Nível', iv:'Indicador', fit:'FITescola', con:'Conhecimentos', av:'Atitudes', comp:'Competências', obs:'Observação', med:'Medidas', auto:'Autoavaliação'};
const hval = x => x == null || x === '' ? '—' : typeof x === 'object' ? (Object.values(x).every(v => v === true) ? Object.keys(x).length + ' assinaladas' : 'alterado') : String(x).replace('.', ',');
function histDiff(a, b) {
  const ev = [];
  Object.keys(HLAB).forEach(f => {
    const A = (a || {})[f] || {}, B = (b || {})[f] || {};
    new Set([...Object.keys(A), ...Object.keys(B)]).forEach(aid => {
      const x = A[aid], y = B[aid]; if (JSON.stringify(x ?? null) === JSON.stringify(y ?? null)) return;
      if (f === 'obs' || f === 'med' || f === 'con' || f === 'auto' || typeof x !== 'object' && typeof y !== 'object') { ev.push({aid, f, k:'', de:f === 'auto' ? (x ? 'feita' : '—') : hval(x), para:f === 'auto' ? (y ? 'feita' : '—') : hval(y)}); return; }
      new Set([...Object.keys(x || {}), ...Object.keys(y || {})]).forEach(k => {
        const u = (x || {})[k], w = (y || {})[k]; if (JSON.stringify(u ?? null) === JSON.stringify(w ?? null)) return;
        const lab = f === 'iv' ? (Object.values(b.ind || {}).flat().find(i => i.id === k) || {}).n || k : f === 'av' ? AVN[k] || k : f === 'fit' ? ((FIT.find(z => z.k === k.replace(/_z$/, '')) || {}).n || k) + (/_z$/.test(k) ? ' (zona)' : '') : k;
        ev.push({aid, f, k:lab, de:f === 'av' && u != null ? u + 1 : hval(u), para:f === 'av' && w != null ? w + 1 : hval(w)});
      });
    });
  });
  return ev;
}
function histRecord(v) {

  const h = S.hist[v.turmaId] = S.hist[v.turmaId] || {id:v.turmaId, ev:[]}, now = Date.now();
  evs.forEach(e => {
    const last = [...h.ev].reverse().find(x => x.aid === e.aid && x.f === e.f && x.k === e.k && x.p === v.p);
    if (last && now - last.ts < 8000) { last.para = e.para; last.ts = now; if (last.de === last.para) h.ev.splice(h.ev.indexOf(last), 1); }
    else h.ev.push(Object.assign({ts:now, p:v.p}, e));

  Store.save('hist', h);
}

function loadImg(file) {

}

async function thumb(file) {

  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');

function matchFoto(fname, als) {

}
