/* ---------- classificação para a escola ---------- */
// 0–20 → nível 1–5 (2.º e 3.º ciclos) ou menção (1.º ciclo); limites editáveis em Mais.
function nivel(t, fin) {
  if (fin == null || t.ciclo === 'S') return null;
  const c = CFG.niv || [4, 10, 14, 18]; const n = fin < c[0] ? 1 : fin < c[1] ? 2 : fin < c[2] ? 3 : fin < c[3] ? 4 : 5;
  return t.ciclo === '1' ? ['Insuficiente', 'Insuficiente', 'Suficiente', 'Bom', 'Muito Bom'][n - 1] : n;
}
const nivelLbl = t => t.ciclo === '1' ? 'Menção' : 'Nível';

/* ---------- gráficos da turma (Pauta → Gráficos) ---------- */
function vGraficos(t) {
  const p = UI.p, als = alunosOf(t), rows = als.map(al => ({al, r:calc(t, p, al)})), ms = matsOf(t, p), v = avalOf(t.id, p);
  if (!als.length) return `<div class="card empty"><h3>Sem alunos</h3></div>`;
  let h = '';
  // 1. Classificações
  if (t.ciclo === 'S') {
    const bins = [['0–4', 0, 4], ['5–9', 5, 9], ['10–11', 10, 11], ['12–13', 12, 13], ['14–15', 14, 15], ['16–17', 16, 17], ['18–20', 18, 20]];
    const d = bins.map(([l, a, b]) => { const n = rows.filter(x => x.r.FIN != null && x.r.FIN >= a && x.r.FIN <= b).length; return {label:l, v:n, tip:`${l} valores: ${n} ${n === 1 ? 'aluno' : 'alunos'}`}; });
    h += fig('Classificações finais', `${rows.filter(x => x.r.FIN != null).length} de ${rows.length} alunos com classificação`, chColumns(d, {label:'Distribuição das classificações finais'}) + tableView(['Valores', 'Alunos'], d.map(x => [x.label, x.v])));
  } else {
    const ks = t.ciclo === '1' ? ['Insuficiente', 'Suficiente', 'Bom', 'Muito Bom'] : [1, 2, 3, 4, 5];
    const d = ks.map(k => { const n = rows.filter(x => nivel(t, x.r.FIN) === k).length; return {label:String(k), v:n, tip:`${nivelLbl(t)} ${k}: ${n} ${n === 1 ? 'aluno' : 'alunos'}`}; });
    h += fig(t.ciclo === '1' ? 'Menções' : 'Níveis', `${rows.filter(x => x.r.FIN != null).length} de ${rows.length} alunos com classificação`, chColumns(d, {label:'Distribuição dos níveis'}) + tableView([nivelLbl(t), 'Alunos'], d.map(x => [x.label, x.v])));
  }
  // Mapa da turma
  if (ms.length) h += fig('Mapa da turma', 'Nível de cada aluno em cada matéria', chMapa(t, p) + legend(LVB.map((b, i) => ({name:b.name, color:`var(--q${i + 1})`}))));
  // Aprendizagens Essenciais
  const aes = als.map(al => aeOf(t, al, p));
  if (aes[0]) {
    const A = aes[0].A, keys = [{k:0, name:'Não atinge', color:'var(--st-crit)'}, {k:1, name:'Proficiente', color:'var(--q2)'}, {k:2, name:aeTop(A), color:'var(--q4)'}, {k:'n', name:'Sem dados', color:'var(--v-none)'}];
    const rs = [['Atividades físicas', 'af'], ['Aptidão física', 'apf'], ['Conhecimentos', 'con']].map(([l, k]) => { const c = {}; aes.forEach(a => { const x = a[k] == null ? 'n' : a[k]; if (x !== 'na') c[x] = (c[x] || 0) + 1; }); return {label:l, c}; });
    h += fig(`Aprendizagens Essenciais · ${aes[0].ano}.º ano`, 'Situação de cada aluno até ao ' + perLabel(p, true) + ' (DGE, março de 2026)', chStack(rs, keys, {id:'ae'}) + legend(keys) + tableView(['Domínio', ...keys.map(k => k.name)], rs.map(r => [r.label, ...keys.map(k => r.c[k.k] || 0)])));
  }
  // 2. Estado
  const st = {}; rows.forEach(x => st[x.r.EST] = (st[x.r.EST] || 0) + 1);
  h += fig('Situação da turma', perLabel(p, true), chStack([{label:'Turma', c:st}], STK, {id:'st'}) + legend(STK.map(k => ({name:k.name + ' · ' + (st[k.k] || 0), color:k.color}))));
  // Evolução da turma ao longo do ano

  if (allr.filter(rs => rs.some(r => r.FIN != null || r.AF != null)).length >= 2) {
    const mk = k => allr.map(rs => { const xs = rs.map(r => r[k]).filter(x => x != null); return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null; });
    const ser = [{name:'Final', color:'var(--v1)', vals:mk('FIN')}, {name:'Matérias', color:'var(--v2)', vals:mk('AF')}, {name:'Apt. física', color:'var(--v3)', vals:mk('APF')}, {name:'Atitudes', color:'var(--v7)', vals:mk('AV')}];
    h += fig('Evolução da turma', 'Médias por período, escala 0–20', chLine(ps.map(i => perLabel(i)), ser, {label:'Evolução das médias da turma'}) + legend(ser));
    const pct = f => allr.map(rs => { const xs = rs.filter(f(true)); return xs.length ? Math.round(rs.filter(f(false)).length / xs.length * 100) : null; });
    const s2 = [{name:'Aptos', color:'var(--st-good)', vals:pct(all => r => all ? r.FIN != null : r.EST === 'Apto')}, {name:'Vaivém na ZS', color:'var(--v1)', vals:pct(all => r => all ? r.zones.vaivem != null : r.zones.vaivem >= 1)}];
    h += fig('Aptos e aptidão aeróbia', 'Percentagem dos alunos com dados, por período', chLine(ps.map(i => perLabel(i)), s2, {max:100, ref:50, label:'Percentagem de aptos e de alunos na Zona Saudável do vaivém'}) + legend(s2));
  }
  // 3. Médias por domínio
  const mean = k => { const xs = rows.map(x => x.r[k]).filter(x => x != null); return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null; };
  const dm = [['Matérias (AF)', 'AF'], ['Aptidão física', 'APF'], ['Conhecimentos', 'CON'], ['Atitudes', 'AV'], ['Final', 'FIN']].map(([l, k]) => ({label:l, v:mean(k)}));
  h += fig('Médias da turma por domínio', 'Escala 0–20; a linha marca os 10', chBars(dm, {label:'Médias por domínio'}) + tableView(['Domínio', 'Média'], dm.map(x => [x.label, x.v == null ? '—' : nf(x.v)])));

    h += fig('Níveis por matéria', 'Quantos alunos em cada patamar', chStack(rs, keys, {id:'lv'}) + legend(keys) + tableView(['Matéria', ...LVB.map(b => b.name)], rs.map(r => [r.label, ...LVB.map(b => r.c[b.k] || 0)])));
  }
  // 5. FITescola
  const fr = FIT.map(f => { const c = {}; rows.forEach(({r}) => { const z = r.zones[f.k]; if (z != null) c[z] = (c[z] || 0) + 1; }); return {label:f.n, c}; }).filter(r => Object.keys(r.c).length);
  if (fr.length) h += fig('Aptidão física (FITescola)', 'Zona de cada aluno por teste', chStack(fr, ZNK, {id:'fz'}) + legend(ZNK) + tableView(['Teste', ...ZNK.map(z => z.name)], fr.map(r => [r.label, ...ZNK.map(z => r.c[z.k] || 0)])));
  // 6. Assiduidade por aula
  const aul = aulasOf(t.id).map((a, i) => ({a, n:i + 1})).filter(x => periodOf(x.a.data) === p);
  if (aul.length) {
    const d = aul.map(({a, n}) => { const ps = Object.values(a.presencas || {}), tot = ps.length, pr = ps.filter(s => s !== 'F').length; return {label:'L' + n, v:tot ? Math.round(pr / tot * 100) : 0, tip:`Lição ${n} (${fmtDate(a.data)}): ${pr}/${tot} presentes`}; });
    h += fig('Assiduidade por aula', 'Percentagem de alunos presentes', chColumns(d, {max:100, unit:'%', label:'Assiduidade por aula'}) + tableView(['Lição', '% presentes'], d.map(x => [x.label, x.v + ' %'])));
  }
  return h;
}

/* ---------- ferramentas da aula ---------- */
let TOOL = null;
function audio() { try { TOOL.ac = TOOL.ac || new (window.AudioContext || window.webkitAudioContext)(); TOOL.ac.resume && TOOL.ac.resume(); } catch (e) {} }
function beep(n = 1, f = 880) {
  const ac = TOOL && TOOL.ac; if (!ac) return;
  for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .2; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.6, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .15); o.start(t0); o.stop(t0 + .17); }
}
async function wake(on) { try { if (on && navigator.wakeLock) TOOL.wl = await navigator.wakeLock.request('screen'); else if (TOOL && TOOL.wl) { TOOL.wl.release(); TOOL.wl = null; } } catch (e) {} }
function stopTool() { if (!TOOL) return; clearInterval(TOOL.iv); wake(false); try { TOOL.ac && TOOL.ac.close(); } catch (e) {} TOOL = null; }
function sheetTools() {
  openSheet('Ferramentas da aula', `<div class="list">${[
    ['tool-vai', 'Vaivém (FITescola)', 'Sinais sonoros por percurso e por nível; toque no aluno quando para e o resultado entra na avaliação.'],
    ['tool-cron', 'Cronómetro', 'Velocidade 40 m e agilidade 4×10 m: um aluno atrás do outro, os tempos entram na avaliação.'],
    ['tool-cad', 'Cadência', 'Ritmo de 1 repetição a cada 3 segundos para abdominais e flexões, com contagem.'],
    ['tool-eq', 'Equipas', 'Aleatórias ou equilibradas pelo nível, misturando rapazes e raparigas.']
  ].map(([a, n, d]) => `<button class="li" data-a="${a}"><span class="who"><div class="nm">${n}</div><div class="meta" style="white-space:normal">${d}</div></span><span class="end muted">›</span></button>`).join('')}</div>`);
}
// Vaivém 20 m: nível 1 a 8,0 km/h, nível 2 a 9,0 km/h e +0,5 km/h por nível; cerca de 1 minuto por nível.
function pacer(n) { const kmh = n === 1 ? 8 : 8 + .5 * n, lap = 20 / (kmh / 3.6); return {kmh, lap, laps:Math.ceil(60 / lap)}; }
function pacerAt(ms) {
  let s = ms / 1000, lvl = 1, total = 0;
  for (;;) { const P = pacer(lvl), d = P.lap * P.laps; if (s < d) { const k = Math.floor(s / P.lap); return {lvl, lap:k + 1, total:total + k, P, frac:(s - k * P.lap) / P.lap}; } s -= d; total += P.laps; lvl++; if (lvl > 21) return {lvl:21, lap:1, total, P, frac:0, end:true}; }
}
function sheetVai() {
  const t = turma(); stopTool(); TOOL = {kind:'vai', el:0, run:false, res:{}, last:0, lastLvl:1};
  const als = alunosOf(t).filter(al => (REG[regAt(al)] || REG.Normal).apf > 0);
  openSheet('Vaivém', `<div class="tool"><div class="tbig"><span id="tv-l">Nível 1</span><b id="tv-t">0</b><span id="tv-p">percurso 1 · 8,0 km/h</span><div class="tprog"><i id="tv-b"></i></div></div>
    <div class="btn-row"><button class="btn primary" data-a="tv-go" id="tv-go">Iniciar</button><button class="btn" data-a="tv-reset">Recomeçar</button></div>
    <p class="hint">Um sinal a cada percurso, três sinais ao mudar de nível. Toque no aluno quando ele parar (à segunda falha): fica com os percursos completos até esse momento. Toque de novo para anular. Protocolo aproximado ao da FITescola: confirme com o áudio oficial quando puder.</p>
    <div class="tgrid">${als.map(al => `<button class="tst" data-a="tv-st" data-aid="${esc(al.id)}">${avatar(al, 'sm')}<span class="nm">${esc(al.nome.split(' ')[0])} ${esc(al.nome.split(' ').slice(-1)[0] !== al.nome.split(' ')[0] ? al.nome.split(' ').slice(-1)[0][0] + '.' : '')}</span><b id="tvs-${esc(al.id)}"></b></button>`).join('')}</div></div>`,
    `<button class="btn primary" data-a="tv-save" id="tv-save">Guardar resultados</button>`);
}
function tvTick() {
  const T = TOOL; if (!T || T.kind !== 'vai') return;
  const ms = T.el + (T.run ? performance.now() - T.t0 : 0), s = pacerAt(ms);
  if (T.run && s.total > T.last) { beep(s.lvl > T.lastLvl ? 3 : 1, s.lvl > T.lastLvl ? 1046 : 880); T.last = s.total; T.lastLvl = s.lvl; }
  const q = id => document.getElementById(id); if (!q('tv-t')) return;
  q('tv-l').textContent = 'Nível ' + s.lvl; q('tv-t').textContent = s.total; q('tv-p').textContent = `percurso ${s.lap} de ${s.P.laps} · ${s.P.kmh.toLocaleString('pt-PT', {minimumFractionDigits:1})} km/h`; q('tv-b').style.width = Math.round(s.frac * 100) + '%';
}

function sheetEquipas() {
  const t = turma(), ms = matsOf(t, UI.p), aHoje = aulasOf(t.id).filter(a => a.data === today()).pop();
  UI.eq = Object.assign({n:2, crit:'rand', mix:true, pres:!!aHoje}, UI.eq || {});
  const E = UI.eq; E.res = null;
  openSheet('Equipas', `<div class="form">
    <div class="grid2"><div class="field"><label for="eq-n">Número de equipas</label><select id="eq-n" data-in="eq" data-k="n">${[2, 3, 4, 5, 6, 7, 8].map(n => `<option${E.n === n ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label for="eq-c">Critério</label><select id="eq-c" data-in="eq" data-k="crit"><option value="rand"${E.crit === 'rand' ? ' selected' : ''}>Aleatório</option><option value="fin"${E.crit === 'fin' ? ' selected' : ''}>Equilibrado pela nota final</option>${ms.map(m => `<option value="m:${esc(m)}"${E.crit === 'm:' + m ? ' selected' : ''}>Equilibrado pelo nível em ${esc(m)}</option>`).join('')}</select></div></div>
    <label class="pin"><input type="checkbox" data-in="eq" data-k="mix"${E.mix ? ' checked' : ''}> Misturar rapazes e raparigas por igual</label>
    ${aHoje ? `<label class="pin"><input type="checkbox" data-in="eq" data-k="pres"${E.pres ? ' checked' : ''}> Deixar de fora quem faltou à aula de hoje</label>` : ''}
    <div id="eq-out">${eqHtml()}</div></div>`, `<button class="btn" data-a="eq-copy">Copiar</button><button class="btn primary" data-a="eq-go">Baralhar de novo</button>`);
}
function eqMake() {
  const t = turma(), E = UI.eq, aHoje = aulasOf(t.id).filter(a => a.data === today()).pop();
  let als = alunosOf(t); if (E.pres && aHoje) als = als.filter(al => (aHoje.presencas || {})[al.id] !== 'F');
  const v = avalOf(t.id, UI.p), score = al => { if (E.crit === 'fin') { const r = calc(t, UI.p, al); return r.FIN ?? r.AF ?? 10; } if (E.crit.startsWith('m:')) { const x = lvOf(v, al.id, E.crit.slice(2)); return x ? LVP[x.l] : 11; } return 0; };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const groups = E.mix ? [als.filter(a => a.sexo === 'F'), als.filter(a => a.sexo === 'M'), als.filter(a => a.sexo !== 'F' && a.sexo !== 'M')] : [als];
  const teams = Array.from({length:E.n}, () => ({al:[], sum:0, g:[0, 0, 0]})), avg = tm => tm.al.length ? tm.sum / tm.al.length : 0;
  // Do melhor para o pior (ou baralhado), cada aluno vai para a equipa com menos alunos do seu grupo (sexo),
  // depois com menos alunos e, se equilibrado, com a soma mais baixa: equipas parecidas em número, sexo e nível.
  groups.forEach((g, gi) => { g = shuffle(g.slice()); if (E.crit !== 'rand') g.sort((a, b) => score(b) - score(a));
    g.forEach(al => { const tm = shuffle(teams.slice()).sort((x, y) => x.g[gi] - y.g[gi] || x.al.length - y.al.length || (E.crit === 'rand' ? 0 : avg(x) - avg(y)))[0]; tm.al.push(al); tm.g[gi]++; tm.sum += score(al); }); });
  // Afinação: trocar alunos do mesmo sexo entre equipas enquanto a diferença entre a melhor e a pior média diminuir.
  if (E.crit !== 'rand') {
    const gOf = al => E.mix ? (al.sexo === 'F' ? 0 : al.sexo === 'M' ? 1 : 2) : 0, spread = () => { const a = teams.map(avg); return Math.max(...a) - Math.min(...a); };
    for (let it = 0; it < 100; it++) {
      const cur = spread(); let best = null;
      teams.forEach((A, ai) => teams.forEach((B, bi) => { if (bi <= ai) return; A.al.forEach((x, i) => B.al.forEach((y, j) => {
        if (gOf(x) !== gOf(y)) return; const d = score(y) - score(x); A.al[i] = y; B.al[j] = x; A.sum += d; B.sum -= d;
        const sp = spread(); if (!best || sp < best.sp) best = {sp, A, B, i, j, d};
        A.al[i] = x; B.al[j] = y; A.sum -= d; B.sum += d; })); }));
      if (!best || best.sp >= cur - 1e-9) break;
      const {A, B, i, j, d} = best, x = A.al[i]; A.al[i] = B.al[j]; B.al[j] = x; A.sum += d; B.sum -= d;
    }
  }
  E.res = teams.map(tm => tm.al.map(al => al.id)); E.sc = E.crit !== 'rand' ? teams.map(tm => tm.al.length ? tm.sum / tm.al.length : null) : null;
}
function eqHtml() {
  const t = turma(), E = UI.eq; if (!E.res || E.res.length !== E.n) eqMake();
  const al = id => (t.alunos || []).find(x => x.id === id);
  return `<div class="eqs">${E.res.map((ids, i) => `<div class="eq"><div class="eq-h"><i style="background:var(--v${i + 1})"></i><b>Equipa ${i + 1}</b><span class="muted small">${ids.length} alunos${E.sc && E.sc[i] != null ? ' · média ' + (E.crit.startsWith('m:') ? LV.reduce((b, x) => Math.abs(LVP[x] - E.sc[i]) < Math.abs(LVP[b] - E.sc[i]) ? x : b, 'NI') : nf(E.sc[i])) : ''}</span></div>${ids.map(id => { const a = al(id); return a ? `<div class="eq-a">${avatar(a, 'sm')}<span>${esc(a.nome)}</span></div>` : ''; }).join('')}</div>`).join('')}</div>`;
}

/* ---------- alertas ---------- */
function alertsOf(t, p) {
  const out = [], als = alunosOf(t), v = avalOf(t.id, p), rows = als.map(al => ({al, r:calc(t, p, al)}));
  const fal = rows.filter(x => x.r.c.F >= 3);
  if (fal.length) out.push({k:'bad', txt:`${fal.length} ${fal.length === 1 ? 'aluno tem' : 'alunos têm'} 3 ou mais faltas: ${fal.map(x => x.al.nome.split(' ')[0] + ' (' + x.r.c.F + ')').join(', ')}.`, a:'alunos'});
  const fim = CFG.per[p - 1].fim, dias = fim ? Math.round((new Date(fim + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5) : 99, inc = rows.filter(x => x.r.EST === 'Incompleto').length;
  if (dias >= 0 && dias <= 21 && inc) out.push({k:'warn', txt:`Faltam ${dias} dias para o fim do ${perLabel(p, true)} e ${inc} ${inc === 1 ? 'aluno tem' : 'alunos têm'} a avaliação incompleta.`, a:'todo'});
  matsOf(t, p).forEach(m => { const n = als.filter(al => (REG[regAt(al, p)] || REG.Normal).af > 0 && !lvOf(v, al.id, m)).length; const dadas = aulasOf(t.id).filter(a => periodOf(a.data) === p && (a.materias || []).includes(m)).length; if (n && dadas >= 4) out.push({k:'warn', txt:`${m}: ${dadas} aulas dadas e ${n} ${n === 1 ? 'aluno ainda sem nível' : 'alunos ainda sem nível'}.`, a:'todo'}); });
  const np = rows.filter(x => x.r.EST === 'Não apto'); if (np.length) out.push({k:'bad', txt:`Previsão de Não apto: ${np.map(x => x.al.nome.split(' ')[0]).join(', ')}.`, a:'pauta'});
  if (p > 1) { const dn = als.filter(al => { const a = calc(t, p - 1, al).zones.vaivem, b = calc(t, p, al).zones.vaivem; return a != null && b != null && b < a; }); if (dn.length) out.push({k:'warn', txt:`Vaivém: ${dn.length} ${dn.length === 1 ? 'aluno desceu' : 'alunos desceram'} de zona face ao período anterior (${dn.map(a => a.nome.split(' ')[0]).join(', ')}).`, a:'fit'}); }
  const sd = als.filter(al => !al.sexo || !al.nasc).length; if (sd) out.push({k:'info', txt:`${sd} ${sd === 1 ? 'aluno sem' : 'alunos sem'} sexo ou data de nascimento: necessários para as zonas do FITescola.`, a:'alunos'});
  return out;
}

/* ---------- lesões e dispensas: regime por período ---------- */
const DTIPOS = ['Dispensa Parcial 1', 'Dispensa Parcial 2', 'Dispensa Total', 'Apenas registo'];
const RANK = {'Normal':0, 'Apenas registo':0, 'Dispensa Parcial 1':1, 'Dispensa Parcial 2':2, 'Dispensa Total':3};
const dayN = iso => Math.round(new Date(iso + 'T12:00:00') / 864e5);
// Uma dispensa muda o regime de cálculo de um período quando cobre pelo menos metade dele (até hoje, se o período estiver a decorrer).
function regAt(al, p = UI.p) {
  let r = al.regime || 'Normal'; const per = CFG.per[p - 1]; if (!per || !per.ini || !per.fim || !(al.disp || []).length) return r;
  const t = today(), s = per.ini, e = t < per.ini || t > per.fim ? per.fim : t, span = dayN(e) - dayN(s) + 1;
  (al.disp || []).forEach(d => { if (!d.ini || !RANK[d.tipo]) return; const a = d.ini > s ? d.ini : s, f = d.fim || e, b = f < e ? f : e; if (a > b) return; if ((dayN(b) - dayN(a) + 1) * 2 >= span && RANK[d.tipo] > RANK[r]) r = d.tipo; });
  return r;
}
const dispOn = (al, iso) => (al.disp || []).find(d => d.ini && d.ini <= iso && (!d.fim || d.fim >= iso));
function dispAlerts(ts) {
  const out = [], t = today();

/* ---------- calendário do ano ---------- */

// Arrastar com rato (logo) ou toque (após um toque longo), com deslocamento automático junto às margens.

/* ---------- demo ---------- */
function makeDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const nomes = [['Alice Ferreira','F','2013-03-14'],['Bernardo Lopes','M','2013-06-02'],['Carolina Matos','F','2012-11-21'],['Diogo Antunes','M','2013-01-09'],['Eva Rodrigues','F','2013-08-30'],['Francisco Pires','M','2013-04-17'],['Gabriela Nunes','F','2013-10-05'],['Henrique Sá','M','2012-12-12'],['Inês Carvalho','F','2013-02-27'],['João Teixeira','M','2013-09-19'],['Leonor Batista','F','2013-05-08'],['Martim Gomes','M','2013-07-23'],['Matilde Fonseca','F','2013-11-30'],['Rodrigo Vieira','M','2013-03-03']];
  const t = {id: uid(), nome: 'Exemplo 7.º X', ciclo: '3', ano: 7, escala: '0-20', exemplo: true, alunos: nomes.map(([nome, sexo, nasc], i) => ({id: uid(), num: i + 1, nome, sexo, nasc, regime: i === 6 ? 'Dispensa Parcial 1' : 'Normal', obs: i === 6 ? 'Exemplo: atestado médico (joelho) até dezembro.' : ''}))};
  S.turmas[t.id] = t; Store.save('turmas', t);
  const plan = [['2026-09-16',['Voleibol'],'Apresentação. Normas de funcionamento das aulas. Voleibol: toque de dedos em situação de exercício a pares.'],['2026-09-18',['Voleibol'],'Voleibol: toque de dedos e manchete. Jogo 2x2 em campo reduzido.'],['2026-09-23',['Atletismo'],'Aptidão física: aplicação do teste do vaivém (FITescola).'],['2026-09-25',['Voleibol'],'Voleibol: serviço por baixo. Jogo 2x2.'],['2026-09-30',['Ginástica de Solo'],'Ginástica de solo: rolamento à frente e à retaguarda. Testes de abdominais e flexões.'],['2026-10-02',['Ginástica de Solo'],'Ginástica de solo: apoio facial invertido. Sequência gímnica simples.'],['2026-10-07',['Voleibol'],'Voleibol: jogo 4x4. Avaliação formativa.'],['2026-10-09',['Ginástica de Solo','Voleibol'],'Ginástica de solo: roda. Voleibol: jogo 4x4.'],['2026-10-14',['Atletismo'],'Atletismo: corrida de velocidade, partida baixa. Teste senta e alcança.'],['2026-10-16',['Atletismo'],'Atletismo: salto em comprimento, chamada e impulsão.']];
  plan.forEach(([data, materias, sumario], i) => {
    const pres = {}; t.alunos.forEach(al => { const x = rnd(); pres[al.id] = al.regime !== 'Normal' && i < 8 ? 'D' : x < .05 ? 'F' : x < .1 ? 'A' : x < .16 ? 'M' : 'P'; });
    const a = {id: uid(), turmaId: t.id, data, c: i, materias, sumario, presencas: pres}; S.aulas[a.id] = a; Store.save('aulas', a);
  });
  const v = {id: t.id + '_1', turmaId: t.id, p: 1, materias: [], af: {}, fit: {}, con: {}, av: {}};
  t.alunos.forEach((al, i) => {
    v.af[al.id] = {'Voleibol': LV[1 + Math.floor(rnd() * 5)], 'Ginástica de Solo': LV[Math.floor(rnd() * 6)]};
    const m = al.sexo === 'M'; v.fit[al.id] = {vaivem: Math.round((m ? 22 : 18) + rnd() * 40), abd: Math.round((m ? 15 : 12) + rnd() * 45), ombros: rnd() < .8 ? 'S' : 'N', senta: Math.round(16 + rnd() * 16)};
    if (i % 3) v.con[al.id] = Math.round(8 + rnd() * 11);
    if (i % 4 !== 3) v.av[al.id] = {resp: 1 + Math.floor(rnd() * 3), emp: 1 + Math.floor(rnd() * 3), lid: Math.floor(rnd() * 4)};
  });
  S.aval[v.id] = v; Store.save('aval', v);
  UI.turma = t.id; UI.p = 1; UI.tab = 'aulas'; render(); toast('Turma de exemplo criada (alunos fictícios).');
}

/* ---------- boot ---------- */
(async function boot() {
  loadUI();
  await Store.init();
  if (Store.local && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
  try { S = await Store.loadAll(); } catch (e) { S = emptyData(); toast('Não foi possível ler os dados guardados. Recarregue a página.', 'bad'); }
  if (!S.cfg.geral) S.cfg.geral = defaultCfg(); // sem versão: os dados que já existam passam por todas as migrações
  migrate(S, true);
  Object.values(S.aval).forEach(v => SHADOW[v.id] = clone(v));
  CFG = S.cfg.geral; CFG.fit = Object.assign(clone(FITREF), CFG.fit || {}); while (CFG.per.length < 3) CFG.per.push({ini:'', fim:''});
  if (!S.turmas[UI.turma]) UI.turma = Object.keys(S.turmas)[0] || null;
  if (!UI._pSet) { UI.p = periodOf(today()); }
  if (UI.p > CFG.nper) UI.p = CFG.nper;
  if (!S.turmas[UI.turma] && UI.tab !== 'mais') UI.tab = 'inicio';
  render();
})();
